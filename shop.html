<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Tuhi's Different Nature</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header-fix.css">
<link rel="icon" type="image/png" href="images/Aaabs.png">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <img src="images/Aaabs.png" alt="Tuhi's Different Nature" style="height: 60px; width: auto; display: block;">
    <span>Tuhi's Different Nature</span>
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="shop" id="shop-container">
  <!-- প্রোডাক্টগুলো এখানে জাভাস্ক্রিপ্ট দিয়ে লোড হবে -->
</main>

<footer class="site-footer">
  <p>© <span id="year"></span> Tuhi's Different Nature. All rights reserved.</p>
  <p>Cash on Delivery available across Bangladesh.</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Fetch and render products from JSON
fetch('products.json')
  .then(response => response.json())
  .then(products => {
    const container = document.getElementById('shop-container');
    const categories = [...new Set(products.map(p => p.category))];

    categories.forEach(category => {
      const section = document.createElement('section');
      section.className = 'section';
      
      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = category;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'grid';

      const filteredProducts = products.filter(p => p.category === category);

      filteredProducts.forEach(product => {
        const article = document.createElement('article');
        article.className = 'product';
        
        const encodedName = encodeURIComponent(product.name);
        const encodedPrice = encodeURIComponent(product.price);

        article.innerHTML = `
          <div style="position: relative;">
            <img src="${product.image}" alt="${product.name}" style="width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 4px; margin-bottom: 0.5rem; background: #eee8e0;">
            ${product.tag ? `<span style="position: absolute; top: 10px; left: 10px; background: var(--accent); color: white; font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;">${product.tag}</span>` : ''}
          </div>
          <h3>${product.name}</h3>
          <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; line-height: 1.4;">${product.caption || ''}</p>
          <p class="price">৳ ${product.price}</p>
          <a class="btn btn-small" href="order.html?product=${encodedName}&price=${encodedPrice}" style="text-align: center;">Order Now</a>
        `;
        grid.appendChild(article);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  })
  .catch(error => {
    document.getElementById('shop-container').innerHTML = '<p style="text-align:center; padding: 3rem;">Unable to load products. Please check back later.</p>';
    console.error('Error loading products:', error);
  });
</script>
</body>
</html>
