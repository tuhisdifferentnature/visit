media:
  input: images
  output: images

content:
  - name: products
    label: Manage Products
    type: file
    path: products.json
    fields:
      - name: products
        label: All Products
        type: object
        list: true
        fields:
          - name: name
            label: Product Name
            type: string
          - name: price
            label: Price (BDT)
            type: number
          - name: image
            label: Product Image
            type: image
          - name: category
            label: Category
            type: select
            options:
              values: ["Kurti", "Three Piece", "Saree", "Dress", "Accessories"]
          - name: tag
            label: Tag (Optional)
            type: string
          - name: caption
            label: Short Description (Optional)
            type: string
