<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order — Tuhi's Different Nature</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header-fix.css">

<link rel="icon" type="image/png" href="images/Aaabs.png">
<link rel="apple-touch-icon" href="images/Aaabs.png">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo"><img src="images/Aaabs.png" alt="Tuhi's Different Nature" style="height: 60px; width: auto; display: block;"><span>Tuhi's Different Nature</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="order-wrap">

  <h1 class="page-title">Place your order</h1>

  <div class="order-summary">
    <div>
      <span class="label">Product</span>
      <strong id="product-display">—</strong>
    </div>
    <div>
      <span class="label">Price</span>
      <strong id="price-display">—</strong>
    </div>
  </div>

  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="order-form">

    <input type="hidden" name="product_name" id="product-hidden">
    <input type="hidden" name="product_price" id="price-hidden">
    <input type="hidden" name="_next" value="thank-you.html">
    <input type="hidden" name="payment" value="Cash on Delivery">

    <label>
      Full name
      <input type="text" name="name" required>
    </label>

    <label>
      Phone number
      <input type="tel" name="phone" required>
    </label>

    <label>
      Delivery address
      <textarea name="address" rows="3" required></textarea>
    </label>

    <label>
      Size
      <select name="size" required>
        <option value="">Choose a size</option>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>Free Size</option>
      </select>
    </label>

    <label>
      Email <span class="opt">(optional)</span>
      <input type="email" name="email">
    </label>

    <label>
      Facebook username <span class="opt">(optional)</span>
      <input type="text" name="facebook">
    </label>

    <p class="cod-note">Payment method: <strong>Cash on Delivery</strong></p>

    <button type="submit" class="btn">Confirm Order</button>
  </form>

</main>

<footer class="site-footer">
  <p>© <span id="year"></span> Tuhi's Different Nature. All rights reserved.</p>
  <p>Cash on Delivery available across Bangladesh.</p>
</footer>

<script src="js/script.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
